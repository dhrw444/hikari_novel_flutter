name: Build Signed APK Follow Upstream Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 每天凌晨自动同步上游 15dd

permissions:
  contents: write

jobs:
  sync-upstream:
    name: 自动同步上游 15dd 代码
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & merge
        run: |
          git remote add upstream https://github.com/15dd/hikari_novel_flutter.git || true
          git fetch upstream
          git merge upstream/main --no-edit || true
          git push origin main || true

  build:
    name: 编译 Release APK（Flutter beta + Java 21）
    needs: sync-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-tags: "true"

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read version from pubspec.yaml
        id: get_version
        run: |
          VERSION_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SEM_VER=${VERSION_RAW%+*}
          NEW_TAG="v$SEM_VER"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Parsed version: $SEM_VER"

      - name: Setup Java 21（与原作者一致）
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode JKS keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Setup Flutter（beta 渠道，与原作者一致）
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor

      - name: Flutter pub get
        run: flutter pub get

      # 注入签名+R8配置（保持原有逻辑）
      - name: Inject signing config apply statement
        run: echo 'apply(from = "signing-config.gradle")' >> android/app/build.gradle.kts

      - name: Build signed release APK
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-apk-output
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Check remote tag exists
        id: check_tag
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          if git ls-remote --tags origin "${NEW_TAG}" | grep -q "${NEW_TAG}$"; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Remote tag ${NEW_TAG} already exists, skip release creation."
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Remote tag ${NEW_TAG} not found, will create release with APK."
          fi

      - name: Create Tag & Publish Release (with APK)
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.NEW_TAG }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
