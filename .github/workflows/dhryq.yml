name: Build Signed APK Follow Upstream Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 每天凌晨自动同步上游 15dd

permissions:
  contents: write

jobs:
  sync-upstream:
    name: 自动同步上游 15dd 代码（冲突直接失败）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream代码（只取代码，不搬运上游 tag，避免同名 tag 冲突破坏 CI）
        run: |
          git remote add upstream https://github.com/15dd/hikari_novel_flutter.git || true
          git fetch upstream main

      - name: Merge上游main，遇到冲突直接失败退出
        run: |
          git merge --no-edit upstream/main
          git status

      - name: 无冲突则推送代码
        run: |
          git push origin main

  build:
    name: 编译 Release APK（Flutter beta + Java 21）
    needs: sync-upstream   # sync任务失败，build完全不运行
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-tags: "true"

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read version from pubspec.yaml
        id: get_version
        run: |
          VERSION_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NEW_TAG="$VERSION_RAW"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_RAW=$VERSION_RAW"
          echo "NEW_TAG=$NEW_TAG"

      - name: Setup Java 21（与原作者一致）
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode JKS keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Setup Flutter（beta 渠道，与原作者一致）
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK with tag
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk "hikari_novel_${NEW_TAG}.apk"
          ls -l

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-apk-output
          path: build/app/outputs/flutter-apk/hikari_novel_${{ steps.get_version.outputs.NEW_TAG }}.apk

      - name: Check release exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          echo "检查 Release: $NEW_TAG"
          if gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "⚠️Release $NEW_TAG 已存在，跳过发布（避免重复覆盖）"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "✅Release $NEW_TAG 不存在，准备创建"
          fi

      - name: Force tag to this build commit
        if: steps.check_tag.outputs.EXISTS == 'false'
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          # 同名 tag 可能由上游同步遗留且指向旧 commit，强制指向本次构建的 commit，
          # 保证「tag 指向的源码」与「APK 内源码」一致，避免发布溯源错位。
          git tag -f "$NEW_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$NEW_TAG"

      - name: Publish Release (with APK)
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.NEW_TAG }}
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/hikari_novel_${{ steps.get_version.outputs.NEW_TAG }}.apk
          generate_release_notes: true
