name: Build Signed APK Follow Upstream Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # 每天 02:00 UTC（北京 10:00）巡检一次上游 15dd；无常驻构建，无更新则整条流水线不构建

permissions:
  contents: write

# 同一时间只允许一条流水线：避免定时巡检与 push 同时跑导致 git push 竞态
concurrency:
  group: dhryq-main
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: 自动同步上游 15dd 代码（冲突直接失败）
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream代码（只取代码，不搬运上游 tag，避免同名 tag 冲突破坏 CI）
        run: |
          git remote add upstream https://github.com/15dd/hikari_novel_flutter.git || true
          git fetch upstream main

      - name: Merge上游main（遇到冲突直接失败）并判断上游是否有更新
        id: sync
        run: |
          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 上游无新提交，跳过构建"
          else
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 上游有新提交，已合并推送: $BEFORE -> $AFTER"
          fi

  build:
    name: 编译 Release APK（Flutter beta + Java 21）
    needs: sync-upstream   # sync任务失败，build完全不运行
    # push（我自己改代码）/ workflow_dispatch（手动）一律构建；
    # schedule（每小时巡检）只有上游真有新提交时才构建，没更新绝不空跑
    if: github.event_name != 'schedule' || needs.sync-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        id: checkout
        uses: actions/checkout@v5
        with:
          # 关键：schedule 触发时 sync 任务会往 main 新推 commit，
          # 默认按触发时的旧 sha 取码会构建到旧版本，必须显式取最新 main
          ref: main
          fetch-tags: "true"
          # 生成更新说明需要完整历史与全部 tag（默认浅克隆只有 1 个 commit）
          fetch-depth: 0

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read version from pubspec.yaml
        id: get_version
        run: |
          VERSION_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NEW_TAG="$VERSION_RAW"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_RAW=$VERSION_RAW"
          echo "NEW_TAG=$NEW_TAG"

      - name: Setup Java 21（与原作者一致）
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode JKS keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Setup Flutter（beta 渠道，与原作者一致）
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK with tag
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk "hikari_novel_${NEW_TAG}.apk"
          ls -l

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-apk-output
          path: build/app/outputs/flutter-apk/hikari_novel_${{ steps.get_version.outputs.NEW_TAG }}.apk

      - name: Generate changelog (自动汇总本次更新内容)
        id: changelog
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          # 自动按版本序推算上一版本 tag，汇总两者之间的提交并分类成中文说明
          python3 .github/scripts/gen_release_body.py "$NEW_TAG" "$GITHUB_REPOSITORY" /tmp/release_body.md

      - name: Check release exists / whether APK asset is missing
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          echo "检查 Release: $NEW_TAG"
          if ! gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "HAS_ASSET=false" >> $GITHUB_OUTPUT
            echo "✅Release $NEW_TAG 不存在，准备创建"
          else
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            COUNT=$(gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
            COUNT=${COUNT:-0}
            if [ "$COUNT" -gt 0 ]; then
              echo "HAS_ASSET=true" >> $GITHUB_OUTPUT
              echo "⚠️Release $NEW_TAG 已存在且已有 $COUNT 个附件，跳过发布（避免重复覆盖）"
            else
              echo "HAS_ASSET=false" >> $GITHUB_OUTPUT
              echo "⚠️Release $NEW_TAG 已存在但没有 APK 附件，将补传本次构建的 APK"
            fi
          fi

      - name: Force tag to this build commit
        if: steps.check_tag.outputs.EXISTS == 'false' || steps.check_tag.outputs.HAS_ASSET == 'false'
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          # 指向本次真正构建的 commit（已 checkout main），保证 tag 与 APK 源码一致
          git tag -f "$NEW_TAG" "$(git rev-parse HEAD)"
          git push -f origin "refs/tags/$NEW_TAG"

      - name: Upload APK to existing release (补传缺失附件)
        if: steps.check_tag.outputs.EXISTS == 'true' && steps.check_tag.outputs.HAS_ASSET == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          gh release upload "$NEW_TAG" "build/app/outputs/flutter-apk/hikari_novel_${NEW_TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
          echo "✅已向已存在的 Release $NEW_TAG 补传 APK 附件"
          # 顺手补上本次更新说明：原本为空则直接写入，原本有手写内容则保留并追加
          OLD_BODY=$(gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' || true)
          if [ -z "$OLD_BODY" ]; then
            gh release edit "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release_body.md
            echo "✅已写入自动生成的更新说明"
          else
            { printf '%s\n\n' "$OLD_BODY"; cat /tmp/release_body.md; } > /tmp/release_body_merged.md
            gh release edit "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release_body_merged.md
            echo "✅原有说明已保留，并追加自动生成的更新说明"
          fi

      - name: Publish Release (with APK)
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.NEW_TAG }}
          target_commitish: ${{ steps.checkout.outputs.commit }}
          files: build/app/outputs/flutter-apk/hikari_novel_${{ steps.get_version.outputs.NEW_TAG }}.apk
          # 用 CI 自动生成的本次更新说明，替换掉只有 Full Changelog 链接的默认内容
          body_path: /tmp/release_body.md
