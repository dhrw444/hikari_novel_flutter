name: Build Signed APK Follow Upstream Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 每天凌晨自动同步上游 15dd

permissions:
  contents: write

jobs:
  sync-upstream:
    name: 自动同步上游 15dd 代码（冲突直接失败）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream代码与标签
        run: |
          git remote add upstream https://github.com/15dd/hikari_novel_flutter.git || true
          git fetch upstream --tags

      - name: Merge上游main，遇到冲突直接失败退出
        run: |
          git merge --no-edit upstream/main
          git status

      - name: 无冲突则推送代码与标签
        run: |
          git push origin main
          git push origin --tags

  build:
    name: 编译 Release APK（Flutter beta + Java 21）
    needs: sync-upstream   # sync任务失败，build完全不运行
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-tags: "true"

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read version from pubspec.yaml
        id: get_version
        run: |
          VERSION_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NEW_TAG="v$VERSION_RAW"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_RAW=$VERSION_RAW"
          echo "NEW_TAG=$NEW_TAG"

      - name: Setup Java 21（与原作者一致）
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode JKS keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Setup Flutter（beta 渠道，与原作者一致）
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-apk-output
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Check remote tag exists
        id: check_tag
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          echo "检查标签: $NEW_TAG"
          if git ls-remote --tags origin | grep "/tags/${NEW_TAG}$"; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "⚠️标签 $NEW_TAG 已存在，跳过发布release"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "✅标签 $NEW_TAG 不存在，准备创建Release"
          fi

      - name: Create Tag & Publish Release (with APK)
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.NEW_TAG }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
